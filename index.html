<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #ff9fba, #ff6f91, #ffc1d6);
      position: relative;
    }

    /* Main message */
    .card {
      width: 85%;
      max-width: 700px;
      padding: 50px 35px;
      text-align: center;

      background: rgba(255, 111, 145, 0.45);
      backdrop-filter: blur(12px);

      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 30px;

      box-shadow: 0 20px 60px rgba(120, 0, 40, 0.3);

      z-index: 10;

      animation: appear 1.8s ease;
    }

    h1 {
      color: #8b001f;
      font-size: 42px;
      margin-bottom: 25px;

      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    p {
      color: #650019;
      font-size: 22px;
      line-height: 1.7;
    }

    .main-heart {
      font-size: 50px;
      margin-top: 25px;
      animation: heartbeat 1.2s infinite;
    }

    /* Roses */
    .rose {
      position: absolute;
      font-size: 60px;
      z-index: 2;

      animation: floating 5s ease-in-out infinite;
    }

    .rose1 {
      left: 5%;
      top: 10%;
      animation-delay: 0s;
    }

    .rose2 {
      right: 6%;
      top: 13%;
      animation-delay: 1s;
    }

    .rose3 {
      left: 8%;
      bottom: 10%;
      animation-delay: 2s;
    }

    .rose4 {
      right: 8%;
      bottom: 8%;
      animation-delay: 3s;
    }

    .rose5 {
      left: 45%;
      top: 5%;
      font-size: 45px;
      animation-delay: 1.5s;
    }

    /* Falling hearts */
    .falling-heart {
      position: absolute;
      top: -40px;
      font-size: 22px;
      opacity: 0.8;
      z-index: 1;

      animation: falling 7s linear infinite;
    }

    .heart1 {
      left: 10%;
      animation-delay: 0s;
    }

    .heart2 {
      left: 25%;
      animation-delay: 2s;
      animation-duration: 9s;
    }

    .heart3 {
      left: 40%;
      animation-delay: 1s;
      animation-duration: 6s;
    }

    .heart4 {
      left: 60%;
      animation-delay: 3s;
      animation-duration: 8s;
    }

    .heart5 {
      left: 75%;
      animation-delay: 1.5s;
      animation-duration: 7s;
    }

    .heart6 {
      left: 90%;
      animation-delay: 2s;
      animation-duration: 10s;
    }

    /* Animations */

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes titleGlow {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-25px) rotate(5deg);
      }
    }

    @keyframes falling {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      90% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 35px 22px;
      }

      h1 {
        font-size: 30px;
      }

      p {
        font-size: 18px;
      }

      .rose {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <!-- Red Roses -->
  <div class="rose rose1">🌹</div>
  <div class="rose rose2">🌹</div>
  <div class="rose rose3">🌹</div>
  <div class="rose rose4">🌹</div>
  <div class="rose rose5">🌹</div>

  <!-- Falling Hearts -->
  <div class="falling-heart heart1">❤️</div>
  <div class="falling-heart heart2">❤️</div>
  <div class="falling-heart heart3">❤️</div>
  <div class="falling-heart heart4">❤️</div>
  <div class="falling-heart heart5">❤️</div>
  <div class="falling-heart heart6">❤️</div>

  <!-- Main Message -->
  <div class="card">

    <h1>To My one and only one ❤️</h1>

    <p>
      Write whatever you want here...
      <br>
      This little website is just for you 🌹
    </p>

    <div class="main-heart">❤️</div>

  </div>

</body>
</html>
